<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate PWA File Studio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.18/dist/docx-preview.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        .drag-over { border-color: #3b82f6; background-color: rgba(59, 130, 246, 0.05); }
        .dark .drag-over { background-color: rgba(59, 130, 246, 0.15); }
        .sortable-ghost { opacity: 0.4; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-200 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col pb-10">

    <!-- Header & Theme Toggle -->
    <header class="border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-800 px-4 py-3 sticky top-0 z-50 shadow-xs flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight text-blue-600 dark:text-blue-400">PWA File Studio</h1>
        <button id="themeToggle" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-all font-medium text-sm flex items-center gap-2">
            <span id="themeText">🌙 Dark Mode</span>
        </button>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 space-y-6 flex-1">
        <!-- Unified Dropzone File Picker -->
        <div id="dropzone" class="border-2 border-dashed border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 rounded-2xl p-8 text-center cursor-pointer transition-all hover:border-blue-500 group relative">
            <input type="file" id="fileInput" multiple class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*,video/*,application/pdf,.doc,.docx">
            <div class="space-y-2 pointer-events-none">
                <div class="text-4xl">📂</div>
                <p class="font-medium text-lg text-gray-700 dark:text-gray-300">Tap or Drag Files Here</p>
                <p class="text-xs text-gray-500 dark:text-gray-400">Supports Images, Videos, PDFs, and Word Documents</p>
            </div>
        </div>

        <!-- System Action Buttons Dashboard (Context-Aware) -->
        <div id="actionPanel" class="hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-4 flex-wrap gap-3 items-center justify-between shadow-xs">
            <div class="flex items-center gap-2">
                <span class="text-xs uppercase bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300 px-2.5 py-1 rounded-md font-bold" id="fileCountBadge">0 Files Selected</span>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <button id="mergeBtn" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-xl shadow-xs transition-all">Merge PDFs</button>
                <button id="exportOrderBtn" class="hidden bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-xl shadow-xs transition-all">Save Rearranged PDF</button>
                <button id="ocrBtn" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-xl shadow-xs transition-all">Run OCR Text Scan</button>
                <button id="clearBtn" class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-sm font-semibold px-4 py-2 rounded-xl transition-all">Clear All</button>
            </div>
        </div>

        <!-- Processing Loader Workspace Layout -->
        <div id="statusLoader" class="hidden bg-blue-50 dark:bg-blue-950/30 border border-blue-200 dark:border-blue-900 p-4 rounded-xl flex items-center gap-3">
            <div class="animate-spin text-xl">⏳</div>
            <p id="statusMessage" class="text-sm font-medium text-blue-700 dark:text-blue-300">Processing file systems...</p>
        </div>

        <!-- Main Display Arena Panels -->
        <div id="previewContainer" class="space-y-6">
            <!-- OCR Code / Output Block Component -->
            <div id="ocrWrapper" class="hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-4 space-y-3 shadow-xs">
                <div class="flex justify-between items-center border-b border-gray-100 dark:border-gray-700 pb-2">
                    <h3 class="font-bold text-sm tracking-wide text-gray-500 uppercase dark:text-gray-400">Extracted OCR Text Data</h3>
                    <button id="copyOcrBtn" class="text-xs bg-gray-100 dark:bg-gray-700 hover:bg-blue-600 hover:text-white dark:hover:bg-blue-500 font-semibold px-3 py-1.5 rounded-lg transition-all flex items-center gap-1">
                        <span id="copyText">📋 Copy Content</span>
                    </button>
                </div>
                <textarea id="ocrTextArea" class="w-full h-40 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-3 text-sm font-mono focus:outline-none focus:border-blue-500" readonly placeholder="OCR Text output will generate here..."></textarea>
            </div>

            <!-- Visual File Render Target Areas -->
            <div id="mediaContainer" class="hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-4 flex justify-center items-center shadow-xs overflow-hidden"></div>
            <div id="wordContainer" class="hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-6 shadow-xs overflow-x-auto"></div>
            
            <!-- Reorderable Grid Interface Container -->
            <div id="pdfGridWrapper" class="hidden space-y-2">
                <h3 class="text-sm font-bold tracking-wide text-gray-500 uppercase dark:text-gray-400 px-1">PDF Page Management Grid (Drag items to reorder)</h3>
                <div id="pdfPageGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 p-1"></div>
            </div>
        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const themeText = document.getElementById('themeText');
        const fileInput = document.getElementById('fileInput');
        const dropzone = document.getElementById('dropzone');
        const actionPanel = document.getElementById('actionPanel');
        const fileCountBadge = document.getElementById('fileCountBadge');
        const mergeBtn = document.getElementById('mergeBtn');
        const exportOrderBtn = document.getElementById('exportOrderBtn');
        const ocrBtn = document.getElementById('ocrBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusLoader = document.getElementById('statusLoader');
        const statusMessage = document.getElementById('statusMessage');
        const ocrWrapper = document.getElementById('ocrWrapper');
        const ocrTextArea = document.getElementById('ocrTextArea');
        const copyOcrBtn = document.getElementById('copyOcrBtn');
        const copyText = document.getElementById('copyText');
        const mediaContainer = document.getElementById('mediaContainer');
        const wordContainer = document.getElementById('wordContainer');
        const pdfGridWrapper = document.getElementById('pdfGridWrapper');
        const pdfPageGrid = document.getElementById('pdfPageGrid');

        let loadedFiles = [];
        let pdfPagesArray = []; // Stores individual page models { fileIndex, pageNum, canvasDataUrl }
        let draggedItem = null;

        // --- Theme Engine Setup ---
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            themeText.innerText = '☀️ Light Mode';
        } else {
            html.classList.remove('dark');
            themeText.innerText = '🌙 Dark Mode';
        }

        themeToggle.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                themeText.innerText = '🌙 Dark Mode';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                themeText.innerText = '☀️ Light Mode';
            }
        });

        // --- Event Listeners Integration ---
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleFiles(e.target.files); });
        clearBtn.addEventListener('click', resetStudio);

        function showLoader(msg) { statusLoader.classList.remove('hidden'); statusMessage.innerText = msg; }
        function hideLoader() { statusLoader.classList.add('hidden'); }

        // --- File System Processing Logic ---
        async function handleFiles(files) {
            resetStudio();
            loadedFiles = Array.from(files);
            if (loadedFiles.length === 0) return;

            actionPanel.classList.remove('hidden');
            fileCountBadge.innerText = `${loadedFiles.length} File(s) Staged`;

            const firstFile = loadedFiles[0];
            const fileUrl = URL.createObjectURL(firstFile);

            // Context-Based Feature Routing
            if (firstFile.type.startsWith('image/')) {
                renderImage(fileUrl);
                ocrBtn.classList.remove('hidden');
                ocrBtn.onclick = () => runOcrEngine(firstFile);
            } else if (firstFile.type.startsWith('video/')) {
                renderVideo(fileUrl);
            } else if (firstFile.type === 'application/pdf') {
                if (loadedFiles.length > 1) {
                    mergeBtn.classList.remove('hidden');
                    mergeBtn.onclick = mergePdfFiles;
                }
                showLoader("Parsing PDF layout data structures...");
                await loadPdfGridWorkspace();
                hideLoader();
            } else if (firstFile.name.endsWith('.docx') || firstFile.name.endsWith('.doc')) {
                renderWordDocument(firstFile);
            }
        }

        function resetStudio() {
            mediaContainer.innerHTML = '';
            wordContainer.innerHTML = '';
            pdfPageGrid.innerHTML = '';
            ocrTextArea.value = '';
            mediaContainer.classList.add('hidden');
            wordContainer.classList.add('hidden');
            pdfGridWrapper.classList.add('hidden');
            ocrWrapper.classList.add('hidden');
            mergeBtn.classList.add('hidden');
            exportOrderBtn.classList.add('hidden');
            ocrBtn.classList.add('hidden');
            actionPanel.classList.add('hidden');
            hideLoader();
            pdfPagesArray = [];
            loadedFiles = [];
        }

        // --- Media Layout Viewports ---
        function renderImage(url) {
            mediaContainer.classList.remove('hidden');
            mediaContainer.innerHTML = `<img src="${url}" class="max-h-96 w-auto rounded-xl object-contain shadow-xs">`;
        }

        function renderVideo(url) {
            mediaContainer.classList.remove('hidden');
            mediaContainer.innerHTML = `<video src="${url}" controls autoplay class="w-full max-h-96 rounded-xl shadow-xs bg-black"></video>`;
        }

        function renderWordDocument(file) {
            wordContainer.classList.remove('hidden');
            showLoader("Deconstructing Microsoft XML Document structures...");
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    await docx.renderAsync(e.target.result, wordContainer);
                    hideLoader();
                } catch (err) {
                    wordContainer.innerHTML = `<p class="text-red-500 text-sm font-semibold">Failed to parse Word Document rendering pipeline</p>`;
                    hideLoader();
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // --- Advanced Interactive PDF Grid Engine ---
        async function loadPdfGridWorkspace() {
            pdfPagesArray = [];
            pdfPageGrid.innerHTML = '';
            pdfGridWrapper.classList.remove('hidden');
            exportOrderBtn.classList.remove('hidden');

            for (let fIdx = 0; fIdx < loadedFiles.length; fIdx++) {
                if (loadedFiles[fIdx].type !== 'application/pdf') continue;
                const arrayBuffer = await loadedFiles[fIdx].arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                for (let pNum = 1; pNum <= pdf.numPages; pNum++) {
                    const page = await pdf.getPage(pNum);
                    const viewport = page.getViewport({ scale: 0.3 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    const dataUrl = canvas.toDataURL();

                    pdfPagesArray.push({ fileIndex: fIdx, pageNum: pNum, id: `p-${fIdx}-${pNum}` });
                    createPageThumbnailElement(dataUrl, `p-${fIdx}-${pNum}`, `Doc ${fIdx + 1} - Page ${pNum}`);
                }
            }
        }

        function createPageThumbnailElement(src, id, label) {
            const card = document.createElement('div');
            card.id = id;
            card.draggable = true;
            card.className = "bg-gray-100 dark:bg-gray-800 p-2 rounded-xl border border-gray-200 dark:border-gray-700 shadow-xs flex flex-col items-center gap-2 cursor-grab active:cursor-grabbing transition-transform";
            card.innerHTML = `
                <img src="${src}" class="w-full h-auto border border-gray-300 dark:border-gray-600 rounded-md object-contain">
                <span class="text-[10px] font-bold text-gray-500 dark:text-gray-400">${label}</span>
            `;

            // HTML5 Drag and Drop Event Structures
            card.addEventListener('dragstart', () => { draggedItem = card; setTimeout(() => card.classList.add('sortable-ghost'), 0); });
            card.addEventListener('dragend', () => { card.classList.remove('sortable-ghost'); draggedItem = null; });
            card.addEventListener('dragover', (e) => e.preventDefault());
            card.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedItem && draggedItem !== card) {
                    const children = Array.from(pdfPageGrid.children);
                    const draggedIdx = children.indexOf(draggedItem);
                    const targetIdx = children.indexOf(card);

                    if (draggedIdx < targetIdx) {
                        pdfPageGrid.insertBefore(draggedItem, card.nextSibling);
                    } else {
                        pdfPageGrid.insertBefore(draggedItem, card);
                    }
                    
                    // Synchronise Internal Array Index Layout Positions
                    const updatedChildren = Array.from(pdfPageGrid.children);
                    const newPagesArray = updatedChildren.map(child => pdfPagesArray.find(p => p.id === child.id));
                    pdfPagesArray = newPagesArray;
                }
            });

            pdfPageGrid.appendChild(card);
        }

        // --- PDF Modification Operations (Merge / Export Order) ---
        exportOrderBtn.onclick = async () => {
            if (pdfPagesArray.length === 0) return;
            showLoader("Compiling custom PDF page distribution scheme...");
            try {
                const newDoc = await PDFLib.PDFDocument.create();
                const fileBuffers = [];
                for (let i = 0; i < loadedFiles.length; i++) {
                    fileBuffers.push(await loadedFiles[i].arrayBuffer());
                }

                for (const pMeta of pdfPagesArray) {
                    const sourceDoc = await PDFLib.PDFDocument.load(fileBuffers[pMeta.fileIndex]);
                    const [copiedPage] = await newDoc.copyPages(sourceDoc, [pMeta.pageNum - 1]);
                    newDoc.addPage(copiedPage);
                }

                const pdfBytes = await newDoc.save();
                downloadBlobFile(pdfBytes, 'rearranged_document.pdf', 'application/pdf');
                hideLoader();
            } catch (err) {
                alert("Failed to export compiled PDF document");
                hideLoader();
            }
        };

        async function mergePdfFiles() {
            showLoader("Compiling multiple standalone documents into array sequence...");
            try {
                const mergedDoc = await PDFLib.PDFDocument.create();
                for (const file of loadedFiles) {
                    if (file.type !== 'application/pdf') continue;
                    const buffer = await file.arrayBuffer();
                    const doc = await PDFLib.PDFDocument.load(buffer);
                    const copiedPages = await mergedDoc.copyPages(doc, doc.getPageIndices());
                    copiedPages.forEach((page) => mergedDoc.addPage(page));
                }
                const mergedBytes = await mergedDoc.save();
                downloadBlobFile(mergedBytes, 'merged_document.pdf', 'application/pdf');
                hideLoader();
                resetStudio();
            } catch (err) {
                alert("Critical error parsing during compilation matrix merge.");
                hideLoader();
            }
        }

        function downloadBlobFile(bytes, filename, contentType) {
            const blob = new Blob([bytes], { type: contentType });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        // --- High-Performance OCR Core Engine via Tesseract.js ---
        async function runOcrEngine(sourceMedia) {
            ocrWrapper.classList.remove('hidden');
            ocrTextArea.value = "Initialising Tesseract localized worker core components...";
            showLoader("Processing character recognition arrays...");
            try {
                const result = await Tesseract.recognize(sourceMedia, 'eng', {
                    logger: m => { if(m.status === 'recognizing') statusMessage.innerText = `Running OCR Text Scan: ${Math.round(m.progress * 100)}%`; }
                });
                ocrTextArea.value = result.data.text || "No legible text structure found in input asset context.";
                hideLoader();
            } catch (err) {
                ocrTextArea.value = "Failed execution processing matrix run inside Tesseract system.";
                hideLoader();
            }
        }

        // --- Clipboard Intercept Controller ---
        copyOcrBtn.addEventListener('click', () => {
            if (!ocrTextArea.value) return;
            navigator.clipboard.writeText(ocrTextArea.value).then(() => {
                copyText.innerText = "✅ Copied!";
                copyOcrBtn.classList.add('bg-blue-600', 'text-white');
                setTimeout(() => {
                    copyText.innerText = "📋 Copy Content";
                    copyOcrBtn.classList.remove('bg-blue-600', 'text-white');
                }, 2000);
            });
        });

        // --- Background System Daemon Registrations ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Worker system operational scope locked:', reg.scope))
                    .catch(err => console.error('Lifecycle daemon failure:', err));
            });
        }
    </script>
</body>
</html>
